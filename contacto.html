<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Isaac Ramírez">
    <meta name="description" content="Página de contacto y ubicación de Isaac Ramírez.">
    <title>Contacto | Isaac Ramírez</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" href="imagenes/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        h1, h2, h3, .navbar-brand { font-family: 'Playfair Display', serif; }
        body, p, a, label, input, textarea { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Isaac <span>Ramírez</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- SECCIÓN DE CONTACTO Y MAPA -->
    <main class="container my-5 py-4">
        <h1 class="text-center mb-4 fw-bold">Ponte en Contacto</h1>
        <p class="text-center text-muted mb-5">Completa el formulario o visítanos en León, Gto.</p>

        <div class="row g-5">
            <!-- Formulario -->
            <div class="col-lg-6">
                <div class="card shadow-sm p-4 border-0">
                    <h2 class="h4 mb-4">Envíanos un mensaje</h2>
                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email5" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Enviar Mensaje</button>
                    </form>
                </div>
            </div>

            <!-- Mapa de Ubicación (Google Maps UTL / León, Gto) -->
            <div class="col-lg-6">
                <div class="card shadow-sm p-4 border-0 h-100">
                    <h2 class="h4 mb-4">Nuestra Ubicación</h2>
                    <div class="ratio ratio-4x3 rounded overflow-hidden shadow-sm">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3721.439498144007!2d-101.5794!3d21.1167!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842be3ea62c93d79%3A0xc3910c0aa4829370!2sUniversidad%20Tecnol%C3%B3gica%20de%20Le%C3%B3n!5e0!3m2!1ses-419!2smx!4v1650000000000!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 Isaac Ramírez - Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
